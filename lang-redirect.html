<script>
// 대문(/)에 들어온 방문자를 브라우저 언어에 맞는 판으로 한 번 보낸다.
// <head>에서 돌기 때문에 영어 대문이 그려지기 전에 넘어간다.
//
// 판정 순서
//   1) 예전에 언어 선택에서 직접 고른 언어가 있으면 그것 (localStorage 'mk-lang')
//   2) 브라우저 1순위가 한국어면 한국어
//   3) 브라우저 1순위가 영어라도 목록에 한국어가 있으면 한국어
//      — 크롬을 영어 우선(en, ko, …)으로 둔 한국어 사용자가 이 경우다
//   4) 그 밖에는 목록에서 처음 만나는 사이트 지원 언어(fr·ja·de·es·ru·en)
// 영어로 판정되면 그대로 둔다. 같은 탭에서는 한 번만 판정한다(sessionStorage).
(function(){
  try{
    var p=location.pathname;
    if(p!=='/' && p!=='/index.html') return;
    if(sessionStorage.getItem('mk-lang-choice')) return;
    var SUP={en:'/',ko:'/ko/',fr:'/fr/',ja:'/ja/',de:'/de/',es:'/es/',ru:'/ru/'};
    var t=null;
    try{ t=localStorage.getItem('mk-lang'); }catch(e){}
    if(!t || !SUP[t]){
      var L=(navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language||''];
      L=[].map.call(L, function(x){ return String(x||'').toLowerCase().split('-')[0]; });
      if(L[0]==='ko' || (L[0]==='en' && L.indexOf('ko')>0)){ t='ko'; }
      else { t='en'; for(var i=0;i<L.length;i++){ if(SUP[L[i]]){ t=L[i]; break; } } }
    }
    sessionStorage.setItem('mk-lang-choice','auto');
    if(t!=='en') location.replace(SUP[t]);
  }catch(e){}
})();
</script>
