<script>
(function(){
  var NAV = {
    'research.html':    {en:'Research',     ko:'연구',   fr:'Recherche',    ja:'研究',   de:'Forschung',    es:'Investigación', ru:'Исследования'},
    'publications.html':{en:'Publications', ko:'출판물', fr:'Publications', ja:'論文',   de:'Publikationen',es:'Publicaciones', ru:'Публикации'},
    'teaching.html':    {en:'Teaching',     ko:'교육',   fr:'Enseignement', ja:'教育',   de:'Lehre',        es:'Docencia',      ru:'Преподавание'},
    'cv.html':          {en:'CV',           ko:'약력',   fr:'CV',           ja:'略歴',   de:'CV',           es:'CV',            ru:'CV'},
    'media.html':       {en:'Media',        ko:'미디어', fr:'Médias',       ja:'メディア', de:'Medien',      es:'Medios',        ru:'Медиа'},
    'blog.html':        {en:'Blog',         ko:'블로그', fr:'Blog',         ja:'ブログ', de:'Blog',         es:'Blog',          ru:'Блог'},
    'contact.html':     {en:'Contact',      ko:'연락처', fr:'Contact',      ja:'連絡先', de:'Kontakt',      es:'Contacto',      ru:'Контакты'}
  };
  var LANGNAME = {en:'English', ko:'한국어', fr:'Français', ja:'日本語', de:'Deutsch', es:'Español', ru:'Русский'};
  var PREFIX   = {en:'/', ko:'/ko/', fr:'/fr/', ja:'/ja/', de:'/de/', es:'/es/', ru:'/ru/'};
  var LANGWORD = {en:'Language', ko:'언어', fr:'Langue', ja:'言語', de:'Sprache', es:'Idioma', ru:'Язык'};
  // 국기 — 인라인 SVG(viewBox 0 0 60 40).
  // 국기 이모지는 Windows Chrome에서 'GB'·'KR' 두 글자로 렌더되므로 쓰지 않는다.
  // 태극기·유니언잭은 공식 작도(국기법 시행령 별표 / College of Arms) 좌표를 그대로 옮긴 것.
  var FLAG = {
    en:'<g transform="scale(1 1.3333)" fill="none"><clipPath id="mkukd"><path d="M30 15h30v15zv15H30zh-30v-15zv-15h30z"/></clipPath><path d="M0 0v30h60V0z" fill="#012169"/><path d="M0 0 60 30M60 0 0 30" stroke="#fff" stroke-width="6"/><path d="M0 0 60 30M60 0 0 30" clip-path="url(#mkukd)" stroke="#C8102E" stroke-width="4"/><path d="M30 0v30M0 15h60" stroke="#fff" stroke-width="10"/><path d="M30 0v30M0 15h60" stroke="#C8102E" stroke-width="6"/></g>',
    ko:'<rect width="60" height="40" fill="#fff"/><g transform="translate(30 20) scale(.416667)"><g stroke="#000" stroke-width="4" fill="none"><path transform="rotate(33.690068)" d="M-50-12v24m6 0v-24m6 0v24m76 0V1m0-2v-11m6 0v11m0 2v11m6 0V1m0-2v-11"/><path transform="rotate(-33.690068)" d="M-50-12v24m6 0V1m0-2v-11m6 0v24m76 0V1m0-2v-11m6 0v24m6 0V1m0-2v-11"/></g><g transform="rotate(33.690068)"><path fill="#cd2e3a" d="M12 0a18 18 0 11-36 0 24 24 0 1148 0"/><path fill="#0047a0" d="M-24 0a24 24 0 1048 0A12 12 0 100 0a12 12 0 11-24 0"/></g></g>',
    fr:'<rect width="20" height="40" fill="#002395"/><rect x="20" width="20" height="40" fill="#fff"/><rect x="40" width="20" height="40" fill="#ED2939"/>',
    ja:'<rect width="60" height="40" fill="#fff"/><circle cx="30" cy="20" r="12" fill="#BC002D"/>',
    de:'<rect width="60" height="13.34" fill="#000"/><rect y="13.34" width="60" height="13.33" fill="#DD0000"/><rect y="26.67" width="60" height="13.33" fill="#FFCE00"/>',
    es:'<rect width="60" height="40" fill="#AA151B"/><rect y="10" width="60" height="20" fill="#F1BF00"/>',
    ru:'<rect width="60" height="40" fill="#fff"/><rect y="13.34" width="60" height="13.33" fill="#0039A6"/><rect y="26.67" width="60" height="13.33" fill="#D52B1E"/>'
  };
  var KO_ONLY  = {'interview.html':1,'life.html':1};   // exist only in Korean
  var SHARED   = {'blog.html':1};                       // one board at site root, shared across languages
  function link(lang,file){ return PREFIX[lang] + (file==='index.html'?'':file); }
  function pageOf(){
    var segs=location.pathname.split('/').filter(Boolean);
    var lang='en';
    if(segs.length && PREFIX[segs[0]] && segs[0]!=='en'){ lang=segs[0]; segs=segs.slice(1); }
    var file=segs.length?segs[segs.length-1]:'index.html';
    if(!/\.html$/.test(file)) file='index.html';
    return {lang:lang, file:file};
  }
  var ORIGIN = 'https://kangminku-kr.github.io';
  // hreflang: 이 페이지의 7개 언어판이 서로 '같은 문서의 다른 언어'임을 검색엔진에 알린다.
  // (2026-07-16 검토 발견: 7개 언어 사이트인데 hreflang 0개 → 중복문서 평가·엉뚱한 언어판 노출 위험)
  // 공유 게시판(blog·posts)과 KO 전용 페이지는 대응 언어판이 존재하지 않으므로 제외한다.
  function hreflang(lang, file, onShared){
    if(onShared || KO_ONLY[file]) return;
    var head=document.head; if(!head) return;
    Object.keys(PREFIX).forEach(function(lg){
      var l=document.createElement('link');
      l.setAttribute('rel','alternate');
      l.setAttribute('hreflang',lg);
      l.setAttribute('href', ORIGIN + link(lg,file));
      head.appendChild(l);
    });
    var x=document.createElement('link');
    x.setAttribute('rel','alternate');
    x.setAttribute('hreflang','x-default');
    x.setAttribute('href', ORIGIN + link('en',file));
    head.appendChild(x);
  }
  function run(){
    var p=pageOf(), lang=p.lang, file=p.file;
    var onShared = !!SHARED[file] || location.pathname.indexOf('/posts/')!==-1;  // shared board or a post page
    document.documentElement.lang=lang;
    hreflang(lang, file, onShared);
    document.querySelectorAll('.navbar-nav .nav-link').forEach(function(a){
      if(a.classList.contains('dropdown-toggle')) return;
      var t=(a.getAttribute('href')||'').split('/').pop()||'index.html';
      if(NAV[t]){ a.setAttribute('href', SHARED[t] ? '/'+t : link(lang,t)); a.textContent=NAV[t][lang]||NAV[t].en; }
    });
    var brand=document.querySelector('.navbar-brand');
    if(brand) brand.setAttribute('href', link(lang,'index.html'));
    var byName={}; Object.keys(LANGNAME).forEach(function(lg){ byName[LANGNAME[lg]]=lg; });
    document.querySelectorAll('.navbar .dropdown-item').forEach(function(a){
      var lg=byName[(a.textContent||'').trim()];
      if(!lg) return;
      var target=((KO_ONLY[file] && lg!=='ko') || onShared) ? link(lg,'index.html') : link(lg,file);
      a.setAttribute('href', target);
      if(lg===lang){ a.classList.add('active'); a.setAttribute('aria-current','true'); }
    });
    document.querySelectorAll('.navbar .nav-link.dropdown-toggle').forEach(function(tog){
      var menu=tog.parentElement.querySelector('.dropdown-menu');
      if(menu && menu.textContent.indexOf('Français')!==-1){ tog.textContent='🌐 '+LANGNAME[lang]; }
    });

    // 대문의 언어 선택 — 접힌 'Language' 탭을 누르면 7개 언어가 아래로 펼쳐진다.
    var bar=document.querySelector('.mk-langbar');
    if(bar){
      function flagSvg(lg){
        return '<span class="mk-flag" aria-hidden="true">'
             + '<svg viewBox="0 0 60 40" xmlns="http://www.w3.org/2000/svg">' + FLAG[lg] + '</svg></span>';
      }
      var d=document.createElement('details');
      d.className='mk-langpick';
      var sm=document.createElement('summary');
      sm.setAttribute('aria-label', LANGWORD.en);
      sm.innerHTML = flagSvg(lang) + '<span class="mk-lword">' + (LANGWORD[lang]||LANGWORD.en) + '</span>'
        + '<svg class="mk-chev" viewBox="0 0 10 6" aria-hidden="true"><path d="M1 1l4 4 4-4" fill="none"'
        + ' stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      d.appendChild(sm);
      var list=document.createElement('div');
      list.className='mk-langlist';
      Object.keys(PREFIX).forEach(function(lg){
        var a=document.createElement('a');
        a.setAttribute('href', ((KO_ONLY[file] && lg!=='ko') || onShared) ? link(lg,'index.html') : link(lg,file));
        a.setAttribute('hreflang', lg);
        a.innerHTML = flagSvg(lg) + '<span class="mk-lname">' + LANGNAME[lg] + '</span>';
        if(lg===lang){ a.className='is-current'; a.setAttribute('aria-current','true'); }
        list.appendChild(a);
      });
      d.appendChild(list);
      bar.appendChild(d);
      // 바깥을 누르거나 Esc 를 누르면 닫는다.
      document.addEventListener('click', function(e){ if(d.open && !d.contains(e.target)) d.open=false; });
      document.addEventListener('keydown', function(e){ if(e.key==='Escape' && d.open){ d.open=false; sm.focus(); } });
    }
  }
  // 첫 방문자의 브라우저 언어가 한국어면 한국어판으로 한 번만 보낸다.
  // (직접 언어를 고른 사람은 sessionStorage 표시로 다시 튕기지 않는다.)
  function autoLang(){
    try{
      if(location.pathname!=='/' && location.pathname!=='/index.html') return;
      if(sessionStorage.getItem('mk-lang-choice')) return;
      var pref=(navigator.languages && navigator.languages[0]) || navigator.language || '';
      if(!/^ko/i.test(pref)) return;
      sessionStorage.setItem('mk-lang-choice','auto');
      location.replace('/ko/');
    }catch(e){}
  }
  // 언어를 직접 고르면 자동이동을 끈다.
  document.addEventListener('click', function(e){
    var a=e.target && e.target.closest && e.target.closest('.mk-langlist a, .navbar .dropdown-item');
    if(a){ try{ sessionStorage.setItem('mk-lang-choice','manual'); }catch(err){} }
  }, true);
  autoLang();

  if(document.readyState!=='loading') run(); else document.addEventListener('DOMContentLoaded',run);
})();
</script>
